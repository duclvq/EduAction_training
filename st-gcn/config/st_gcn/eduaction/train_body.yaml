# EduAction Dataset Configuration for ST-GCN - Body Only
# 23 keypoints (body + feet only) with 2D coordinates
# Lighter model, faster training

work_dir: ./work_dir/recognition/eduaction_body/ST_GCN

# feeder
feeder: feeder.feeder_eduaction.FeederEduAction
train_feeder_args:
  data_dir: /mnt/d/data/EduAction_pose_data  # Change this to your data path
  split: train
  random_choose: True
  random_move: True
  window_size: 64
  debug: False
  train_ratio: 0.7
  seed: 42
  keypoint_subset: body_only  # Only 23 body keypoints

test_feeder_args:
  data_dir: /mnt/d/data/EduAction_pose_data
  split: test
  window_size: 64
  debug: False
  train_ratio: 0.7
  seed: 42
  keypoint_subset: body_only

# model
model: net.st_gcn.Model
model_args:
  in_channels: 2
  num_class: 7
  dropout: 0.5
  edge_importance_weighting: True
  graph_args:
    layout: 'eduaction_body'
    strategy: 'spatial'

# optimizer
weight_decay: 0.0001
base_lr: 0.01
step: [40, 60, 80]
optimizer: SGD
nesterov: True

# training
device: [0]
batch_size: 32  # Can use larger batch with fewer keypoints
test_batch_size: 32
num_epoch: 100
