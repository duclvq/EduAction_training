# EduAction Dataset Configuration for ST-GCN - Testing/Evaluation
# Use this config for evaluating a trained model

work_dir: ./work_dir/recognition/eduaction/ST_GCN

# feeder
feeder: feeder.feeder_eduaction.FeederEduAction
train_feeder_args:
  data_dir: /mnt/d/data/EduAction_pose_data
  split: train
  window_size: 64
  debug: False
  train_ratio: 0.7
  seed: 42
  keypoint_subset: full_body

test_feeder_args:
  data_dir: /mnt/d/data/EduAction_pose_data
  split: test
  window_size: 64
  debug: False
  train_ratio: 0.7
  seed: 42
  keypoint_subset: full_body

# model
model: net.st_gcn.Model
model_args:
  in_channels: 2
  num_class: 7
  dropout: 0.5
  edge_importance_weighting: True
  graph_args:
    layout: 'eduaction'
    strategy: 'spatial'

# weights - specify the trained model weights
weights: ./work_dir/recognition/eduaction/ST_GCN/best_model.pt

# training (not used for testing)
device: [0]
batch_size: 16
test_batch_size: 16
num_epoch: 120

# evaluation settings
phase: test
