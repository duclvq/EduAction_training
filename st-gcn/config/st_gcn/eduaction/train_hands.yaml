# EduAction Dataset Configuration for ST-GCN - Body + Hands
# 65 keypoints (body + both hands) with 2D coordinates
# Good for gesture-based action recognition

work_dir: ./work_dir/recognition/eduaction_hands/ST_GCN

# feeder
feeder: feeder.feeder_eduaction.FeederEduAction
train_feeder_args:
  data_dir: /mnt/d/data/EduAction_pose_data  # Change this to your data path
  split: train
  random_choose: True
  random_move: True
  window_size: 64
  debug: False
  train_ratio: 0.7
  seed: 42
  keypoint_subset: body_hands  # Body + hands (65 keypoints)

test_feeder_args:
  data_dir: /mnt/d/data/EduAction_pose_data
  split: test
  window_size: 64
  debug: False
  train_ratio: 0.7
  seed: 42
  keypoint_subset: body_hands

# model
model: net.st_gcn.Model
model_args:
  in_channels: 2
  num_class: 7
  dropout: 0.5
  edge_importance_weighting: True
  graph_args:
    layout: 'eduaction_hands'
    strategy: 'spatial'

# optimizer
weight_decay: 0.0001
base_lr: 0.01
step: [40, 60, 80]
optimizer: SGD
nesterov: True

# training
device: [0]
batch_size: 24
test_batch_size: 24
num_epoch: 100
