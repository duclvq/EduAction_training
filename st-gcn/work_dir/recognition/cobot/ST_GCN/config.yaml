# command line: main.py recognition -c config/cobot/train.yaml

base_lr: 0.01
batch_size: 16
config: config/cobot/train.yaml
debug: false
device:
- 0
eval_interval: 5
feeder: feeder.feeder.Feeder
ignore_weights: []
log_interval: 100
model: net.st_gcn.Model
model_args:
    dropout: 0.5
    edge_importance_weighting: true
    graph_args:
        layout: cobot
        strategy: distance
    in_channels: 3
    num_class: 20
nesterov: true
num_epoch: 200
num_worker: 4
optimizer: SGD
pavi_log: false
phase: train
print_log: true
save_interval: 10
save_log: true
save_result: false
show_topk:
- 1
- 5
start_epoch: 0
step:
- 30
- 70
test_batch_size: 16
test_feeder_args:
    data_path: ./data_ori/xsub/val_position.npy
    label_path: ./data_ori/xsub/val_label.pkl
train_feeder_args:
    data_path: ./data_ori/xsub/train_position.npy
    data_ratio: 1.0
    label_path: ./data_ori/xsub/train_label.pkl
use_gpu: true
weight_decay: 0.0001
weights: null
work_dir: ./work_dir/recognition/cobot/ST_GCN
