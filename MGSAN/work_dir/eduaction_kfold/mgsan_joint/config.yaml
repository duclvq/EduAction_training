base_lr: 0.1
batch_size: 16
data_dir: /mnt/d/data/EduAction_pose_data
device:
- 0
eval_interval: 1
keypoint_subset: full_body
model_args:
  dropout: 0.0
  graph: graph.eduaction.GraphEduActionFullBody
  graph_args:
    labeling_mode: spatial
  in_channels: 2
  num_class: 7
  num_person: 1
  num_point: 133
n_folds: 5
nesterov: true
num_epoch: 120
num_worker: 4
optimizer: SGD
p_interval:
- 0.5
- 1
random_rot: true
save_interval: 10
seed: 42
step:
- 60
- 80
- 100
test_batch_size: 16
use_gpu: true
weight_decay: 0.0001
window_size: 64
work_dir: ./work_dir/eduaction_kfold/mgsan_joint
