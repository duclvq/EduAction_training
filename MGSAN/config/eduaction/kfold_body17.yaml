# K-Fold Cross Validation Config for MGSAN on EduAction (Body-only 17 kp, MediaPipe)
# Same 17 joints as COCO-17 but extracted by MediaPipe

work_dir: ./work_dir/eduaction_kfold/mgsan_body17

n_folds: 5
seed: 42

# Data settings — MediaPipe source
data_dir: D:/data/EduAction_pose_data
keypoint_subset: body_no_feet  # 17 kp (index 0-16)
window_size: 64

p_interval: [0.5, 1]
random_rot: true

model_args:
  num_class: 7
  num_point: 17
  num_person: 1
  in_channels: 2
  dropout: 0.0
  graph: graph.eduaction.GraphEduActionBodyNoFeet
  graph_args:
    labeling_mode: spatial

num_epoch: 120
batch_size: 16
test_batch_size: 16
num_worker: 4

optimizer: SGD
base_lr: 0.01
weight_decay: 0.0001
nesterov: true
step:
  - 60
  - 80
  - 100

eval_interval: 1
save_interval: 10

use_gpu: true
device:
  - 0
