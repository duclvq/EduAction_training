# EduAction Dataset Configuration for MGSAN
# 133 keypoints (COCO-WholeBody format) with 2D coordinates

work_dir: ./work_dir/eduaction/mgsan_joint

# Feeder configuration
feeder: feeders.feeder_eduaction.FeederEduAction
train_feeder_args:
  data_dir: /mnt/d/data/EduAction_pose_data  # Change this to your data path
  split: train
  window_size: 64
  p_interval: [0.5, 1]
  random_rot: True
  debug: False
  train_ratio: 0.7
  seed: 42
  bone: False
  vel: False
  keypoint_subset: full_body  # full_body, upper_body, body_only, face_hands, hands_only, body_hands

test_feeder_args:
  data_dir: /mnt/d/data/EduAction_pose_data  # Change this to your data path
  split: test
  window_size: 64
  p_interval: [1]
  random_rot: False
  debug: False
  train_ratio: 0.7
  seed: 42
  bone: False
  vel: False
  keypoint_subset: full_body

# Model configuration
model: model.MGSAN.Model
model_args:
  num_class: 7  # 7 classes in EduAction
  num_point: 133  # COCO-WholeBody keypoints
  num_person: 1  # Single person
  in_channels: 2  # 2D coordinates (x, y)
  graph: graph.eduaction.GraphEduAction
  dropout: 0.1
  Is_joint: True
  K: 0
  graph_args:
    labeling_mode: 'spatial'

# Optimizer configuration
weight_decay: 0.0004
base_lr: 0.01
lr_decay_rate: 0.1
step: [60, 80, 100]
warm_up_epoch: 5

# Training configuration
device: [0]
batch_size: 16
test_batch_size: 16
num_epoch: 120
num_worker: 4
nesterov: True
