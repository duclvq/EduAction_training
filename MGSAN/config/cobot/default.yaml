work_dir: ./work_dir/cobot/ctrgcn_joint
feeder: feeders.feeder_cobot.FeederCobot
train_feeder_args:
  data_path: ./data/cobot/train.pickle
  split: train
  debug: False
  window_size: 64
  normalization: False
test_feeder_args:
  data_path: ./data/cobot/test.pickle
  split: test
  window_size: 64
  normalization: False
  debug: False
model: model.MGSAN.Model
model_args:
  num_class: 20  # Sửa lại đúng số class thực tế nếu cần
  num_point: 48
  num_person: 1
  graph: graph.cobot.GraphCobot
  dropout: 0.1
  Is_joint: True
  K: 0
  graph_args:
    labeling_mode: 'spatial'
#optim
weight_decay: 0.0004
base_lr: 0.01
lr_decay_rate: 0.1
step: [90, 100]
warm_up_epoch: 5
# training
device: [0]
batch_size: 16
test_batch_size: 16
num_epoch: 110
nesterov: True